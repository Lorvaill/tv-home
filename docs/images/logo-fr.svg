<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2140"/>
      <stop offset="1" stop-color="#1F7A63"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="flag"><circle cx="146" cy="146" r="30"/></clipPath>
  </defs>
  <!-- The app's icon: the TV on its gradient, under a touch of glass. -->
  <rect x="16" y="16" width="160" height="160" rx="38" fill="url(#bg)"/>
  <rect x="16" y="16" width="160" height="160" rx="38" fill="url(#shine)"/>
  <rect x="16.5" y="16.5" width="159" height="159" rx="37.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25"/>
  <text x="96" y="113" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">TV</text>
  <!-- The French flag badge. -->
  <circle cx="146" cy="146" r="34" fill="#FFFFFF"/>
  <g clip-path="url(#flag)">
    <rect x="116" y="116" width="20" height="60" fill="#0055A4"/>
    <rect x="136" y="116" width="20" height="60" fill="#FFFFFF"/>
    <rect x="156" y="116" width="20" height="60" fill="#EF4135"/>
  </g>
  <circle cx="146" cy="146" r="30" fill="none" stroke="#0B2140" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- The name. -->
  <text x="212" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#1F7A63">TV Home</text>
  <text x="214" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#6E7F8D" letter-spacing="1">VERSION FRANÇAISE</text>
</svg>
